name: Build Bible Quest Pro v2.3

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Rebuild and unpack source
        run: |
          cat source.part0 source.part1 source.part2 source.part3 | base64 -d > BibleQuestPro-v2-source.zip
          unzip -t BibleQuestPro-v2-source.zip
          mkdir bibleapp
          unzip -q BibleQuestPro-v2-source.zip -d bibleapp
      - name: Apply multilingual v2.2 base
        run: |
          base64 -d multilang-v22.patch.gz.b64 | gzip -d > multilang-v22.patch
          cd bibleapp
          patch -p1 < ../multilang-v22.patch
      - name: Apply v2.3 instant-language and music patch
        run: python3 v23_build_patch.py
      - name: Validate v2.3 source
        run: |
          grep -q 'QuizLanguageSwitcher' bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt
          grep -q 'MediaPlayer.create' bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt
          grep -q 'Music volume' bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt
          grep -q 'Page.MIXED' bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt
          test -s bibleapp/app/src/main/res/raw/bible_ambient.wav
      - name: Export v2.3 audited source
        run: |
          cd bibleapp
          zip -qr ../BibleQuestPro-v2.3-patched-source.zip .
      - name: Upload v2.3 source
        uses: actions/upload-artifact@v4
        with:
          name: BibleQuestPro-v2.3-patched-source
          path: BibleQuestPro-v2.3-patched-source.zip
          if-no-files-found: error
      - name: Smoke test Scripture endpoints
        run: |
          python3 - <<'PY'
          import json, urllib.request
          urls=[
            'https://raw.githubusercontent.com/OpenTranslationBible/open-bible/main/lang/en-GB/01.Genesis/json/genesis-01.json',
            'https://raw.githubusercontent.com/OpenTranslationBible/open-bible/main/lang/hi-IN/01.%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%A4%E0%A4%BF/json/%E0%A4%89%E0%A4%A4%E0%A5%8D%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%A4%E0%A4%BF-01.json'
          ]
          for url in urls:
              with urllib.request.urlopen(url,timeout=20) as r:
                  data=json.load(r)
              assert data.get('chapter')==1
          print('Scripture endpoints OK')
          PY
      - name: Build APK
        working-directory: bibleapp
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../build-v23.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BibleQuestPro-v2.3-build-log
          path: build-v23.log
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleQuestPro-v2.3-InstantLanguage-Music-APK
          path: bibleapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error