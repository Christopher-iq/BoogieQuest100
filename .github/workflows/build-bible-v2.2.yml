name: Build Bible Quest Pro v2.4

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Rebuild and unpack source
        run: |
          cat source.part0 source.part1 source.part2 source.part3 | base64 -d > BibleQuestPro-v2-source.zip
          unzip -t BibleQuestPro-v2-source.zip
          mkdir bibleapp
          unzip -q BibleQuestPro-v2-source.zip -d bibleapp
      - name: Apply multilingual v2.2 base
        run: |
          base64 -d multilang-v22.patch.gz.b64 | gzip -d > multilang-v22.patch
          cd bibleapp
          patch -p1 < ../multilang-v22.patch
      - name: Apply v2.3 language and music base
        run: python3 v23_build_patch.py
      - name: Apply v2.4 resume navigation and audio patch
        run: python3 v24_build_patch.py
      - name: Validate v2.4 source
        run: |
          grep -q 'BackHandler(enabled=page!=Page.HOME)' bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt
          grep -q 'bible_quest_v24' bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt
          grep -q 'quiz_index' bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt
          grep -q 'onProgress(idx,score)' bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt
          grep -q 'music_volume' bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt
          grep -q 'versionName = "2.4.0"' bibleapp/app/build.gradle.kts
          test -s bibleapp/app/src/main/res/raw/bible_ambient.wav
      - name: Export v2.4 audited source
        run: |
          cd bibleapp
          zip -qr ../BibleQuestPro-v2.4-patched-source.zip .
      - name: Upload v2.4 source
        uses: actions/upload-artifact@v4
        with:
          name: BibleQuestPro-v2.4-patched-source
          path: BibleQuestPro-v2.4-patched-source.zip
          if-no-files-found: error
      - name: Build APK
        working-directory: bibleapp
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../build-v24.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BibleQuestPro-v2.4-build-log
          path: build-v24.log
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleQuestPro-v2.4-Resume-Back-Audio-APK
          path: bibleapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
