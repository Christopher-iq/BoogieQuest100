name: Build CASE ZERO Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate lossless game audio
        run: cd casezero_game && python3 tools/generate_casezero_audio.py

      - name: Build installable APK
        run: cd casezero_game && gradle --no-daemon --stacktrace :casezero:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp casezero_game/casezero/build/outputs/apk/debug/casezero-debug.apk release/CaseZero-TheLastWitness-v1.0.apk
          ls -lh release/CaseZero-TheLastWitness-v1.0.apk

      - name: Upload CASE ZERO APK
        uses: actions/upload-artifact@v4
        with:
          name: CaseZero-TheLastWitness-v1.0-APK
          path: release/CaseZero-TheLastWitness-v1.0.apk
          if-no-files-found: error
          compression-level: 0
