name: Build Bible Quest Pro v2

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Rebuild source archive
        run: cat source.part0 source.part1 source.part2 source.part3 | base64 -d > BibleQuestPro-v2-source.zip
      - name: Validate archive
        run: unzip -t BibleQuestPro-v2-source.zip
      - name: Unpack Bible app
        run: mkdir bibleapp && unzip -q BibleQuestPro-v2-source.zip -d bibleapp
      - name: Apply compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bibleapp/app/src/main/java/com/biblequest/pro/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          marker = 'import androidx.compose.ui.graphics.*\n'
          needed = 'import androidx.compose.ui.geometry.Offset\n'
          if needed not in s:
              if marker not in s:
                  raise SystemExit('Expected graphics import marker not found')
              s = s.replace(marker, marker + needed, 1)
              p.write_text(s, encoding='utf-8')
          print('Offset import present:', needed.strip() in p.read_text(encoding='utf-8'))
          PY
      - name: Build APK
        working-directory: bibleapp
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BibleQuestPro-v2-build-log
          path: build.log
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BibleQuestPro-v2-APK
          path: bibleapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
